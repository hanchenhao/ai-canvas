name: Feature Request
description: Suggest an improvement to BrainVite-AI-Canvas
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea clearly so we can evaluate it.

        **Before submitting**, please check:
        - [Existing issues](https://github.com/hanchenhao/ai-canvas/issues) for similar requests

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which part of BrainVite-AI-Canvas does this relate to?
      options:
        - New node type
        - Workflow editor (canvas / UI)
        - Backend / execution engine
        - Model management
        - Chat / agent interface
        - Asset management
        - API / integrations
        - Desktop app (Electron)
        - Docker / deployment
        - Developer / plugin API
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve? What use case does it enable?
      placeholder: "I often need to... but currently I have to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you'd like to see.
      placeholder: "It would be great if BrainVite-AI-Canvas could..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you tried any workarounds or alternative approaches?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any mockups, examples, links, or other context that helps explain the request.
    validations:
      required: false
