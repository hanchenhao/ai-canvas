name: Publish BrainVite Optional Server Image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brainvite-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          sha="$DISPATCH_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=main-${{ steps.source.outputs.short_sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_HASH=${{ steps.source.outputs.short_sha }}
            BUILD_NUMBER=${{ github.run_number }}
            VITE_APP_NAME=BrainVite-AI-Canvas
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
