name: Build BrainVite-AI-Canvas Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: brainvite-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }} desktop package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: --mac dmg zip --arm64
            artifact: macos-arm64
          - name: Windows x64
            os: windows-2022
            target: --win nsis --x64
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            target: --linux AppImage tar.gz --x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "0"
      npm_config_onnxruntime_node_install_cuda: skip
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            chrome-extension
            electron
            packages
            reliability
            scripts
            web
            workflow_runner
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Install browser extension dependencies
        shell: bash
        run: npm install --prefix chrome-extension --no-audit --no-fund

      - name: Build backend packages
        shell: bash
        run: npm run build:packages

      - name: Build web application
        shell: bash
        run: npm run build --workspace=web

      - name: Build bundled browser extension
        shell: bash
        run: npm run build --prefix chrome-extension

      - name: Prepare desktop resources
        shell: bash
        run: |
          npm run vite:build --workspace=electron
          npm run prepare-backend --workspace=electron
          npm run prepare-mcpb --workspace=electron

      - name: Package unsigned desktop application
        shell: bash
        working-directory: electron
        run: npx electron-builder --config electron-builder.json ${{ matrix.target }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: brainvite-ai-canvas-${{ matrix.artifact }}-${{ github.run_number }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.tar.gz
            electron/dist/*.yml
          if-no-files-found: error
          retention-days: 14
